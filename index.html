<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>มหกรรมแลกเปลี่ยนเรียนรู้ผลงานวิชาการและนวัตกรรม จังหวัดสตูลประจำปีงบประมาณ พ.ศ. 2569</title>
    
    <link rel="icon" href="/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="/logo.png">
    <link rel="manifest" href="/manifest.json">
    
    <!-- Google Fonts: Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Tailwind CSS (CDN Mode for Quick Prototyping) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Kanit', 'sans-serif'],
            },
            colors: {
              primary: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                500: '#0ea5e9',
                700: '#0369a1',
                900: '#0c4a6e',
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'bounce-in': 'bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'spin-slow': 'spin 3s linear infinite',
              'flow-up': 'flowUp 2s ease-in-out infinite',
              'scale-subtle': 'scaleSubtle 3s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              bounceIn: {
                '0%': { opacity: '0', transform: 'scale(0.9)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              flowUp: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-5px)' },
              },
              scaleSubtle: {
                '0%, 100%': { transform: 'scale(1)' },
                '50%': { transform: 'scale(1.1)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Kanit', sans-serif;
        /* Default light mode bg handled by App.tsx classes now, but keeping fallback */
        background-color: #f8fafc; 
      }
      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b;
      }
      ::-webkit-scrollbar-thumb {
        background: #475569;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.95.3"
  }
}
</script>
</head>
  <body>
    <!-- Splash Screen -->
    <div id="splash-screen" style="position: fixed; inset: 0; background-color: #0f172a; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease-out; overflow: hidden;">
        
        <!-- Animated Background Gradient Rings -->
        <div style="position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(14,165,233,0.1) 0%, rgba(15,23,42,0) 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); animation: pulse-ring 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;"></div>
        <div style="position: absolute; width: 400px; height: 400px; background: radial-gradient(circle, rgba(14,165,233,0.15) 0%, rgba(15,23,42,0) 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); animation: pulse-ring 4s cubic-bezier(0.4, 0, 0.6, 1) infinite; animation-delay: 1s;"></div>
        
        <div style="position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center;">
            <img src="/logo.png" alt="Logo" style="width: 120px; height: 120px; object-fit: contain; margin-bottom: 30px; animation: glow 2s ease-in-out infinite alternate; filter: drop-shadow(0 0 20px rgba(14,165,233,0.5));" />
            
            <h1 style="font-family: 'Kanit', sans-serif; font-size: 24px; font-weight: 700; color: #f8fafc; margin-bottom: 4px; text-align: center; letter-spacing: 0.5px;">มหกรรมแลกเปลี่ยนเรียนรู้ผลงานวิชาการและนวัตกรรม</h1>
            <h2 style="font-family: 'Kanit', sans-serif; font-size: 20px; font-weight: 500; color: #bae6fd; margin-bottom: 4px; text-align: center;">จังหวัดสตูล</h2>
            <h3 style="font-family: 'Kanit', sans-serif; font-size: 16px; font-weight: 400; color: #94a3b8; margin-bottom: 40px; text-align: center;">ประจำปีงบประมาณ พ.ศ. 2569</h3>
            
            <div style="width: 240px; text-align: center;">
                <div style="font-family: 'Kanit', sans-serif; font-size: 13px; color: #7dd3fc; margin-bottom: 8px; font-weight: 300; letter-spacing: 1px;">กำลังเตรียมระบบ... </div>
                <div style="height: 6px; width: 100%; background-color: #1e293b; border-radius: 9999px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);">
                    <div id="loading-bar" style="height: 100%; width: 0%; box-shadow: 0 0 10px rgba(14,165,233,0.8); background: linear-gradient(90deg, #0284c7, #38bdf8); border-radius: 9999px; transition: width 0.1s ease;"></div>
                </div>
            </div>
        </div>
        
        <div style="position: absolute; bottom: 30px; left: 0; width: 100%; text-align: center; font-family: 'Kanit', sans-serif; font-size: 12px; color: #64748b; font-weight: 300;">
            พัฒนาโดย กลุ่มงานสุขภาพดิจิทัล สำนักงานสาธารณสุขจังหวัดสตูล 2569
        </div>
        
        <style>
            @keyframes pulse-ring {
                0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
                50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
                100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            }
            @keyframes glow {
                from { filter: drop-shadow(0 0 10px rgba(14,165,233,0.3)) scale(0.98); }
                to { filter: drop-shadow(0 0 25px rgba(14,165,233,0.8)) scale(1.02); }
            }
        </style>
    </div>

    <div id="root"></div>
    <script>
        // Simulate loading progress
        let pct = 0;
        const bar = document.getElementById('loading-bar');
        const interval = setInterval(() => {
            pct += Math.random() * 15;
            if (pct >= 100) {
                pct = 100;
                clearInterval(interval);
            }
            if (bar) bar.style.width = pct + '%';
        }, 150);

        // Remove splash screen after DOM is ready and React mounts
        window.addEventListener('load', () => {
            setTimeout(() => {
                pct = 100;
                if (bar) bar.style.width = '100%';
                setTimeout(() => {
                    const splash = document.getElementById('splash-screen');
                    if (splash) {
                        splash.style.opacity = '0';
                        setTimeout(() => splash.remove(), 500);
                    }
                }, 400);
            }, 1200); // minimum showing time
        });
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
